name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_FROZEN: "1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups

      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy

      - name: Check for missing migrations
        run: uv run python -m tests.manage makemigrations --check --dry-run

  test:
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Spelled out rather than a product: each Django release supports a
        # different span of interpreters.
        include:
          - python-version: "3.10"
            django: "5.2"
            django_spec: "django>=5.2,<6.0"
          - python-version: "3.11"
            django: "5.2"
            django_spec: "django>=5.2,<6.0"
          - python-version: "3.12"
            django: "5.2"
            django_spec: "django>=5.2,<6.0"
          - python-version: "3.12"
            django: "6.0"
            django_spec: "django>=6.0,<6.1"
          - python-version: "3.13"
            django: "5.2"
            django_spec: "django>=5.2,<6.0"
          - python-version: "3.13"
            django: "6.0"
            django_spec: "django>=6.0,<6.1"
          - python-version: "3.14"
            django: "6.0"
            django_spec: "django>=6.0,<6.1"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-groups

      - name: Pin Django ${{ matrix.django }}
        run: uv pip install "${{ matrix.django_spec }}"

      - name: Show the resolved versions
        run: uv run --no-sync python -c "import django, sys; print(sys.version); print(django.get_version())"

      - name: Run the test suite
        run: >-
          uv run --no-sync pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.14' && matrix.django == '6.0'
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  # Django's main branch breaks for reasons that are not this project's fault, so it
  # reports without gating the merge.
  django-main:
    name: Django main (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install the project
        run: uv sync --all-groups

      - name: Install Django from main
        run: uv pip install "https://github.com/django/django/archive/main.tar.gz"

      - name: Run the test suite
        run: uv run --no-sync pytest -q

  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv build

      - name: Check the metadata renders on PyPI
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  example:
    name: Example project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups

      - name: Build the database
        run: uv run python -m example.manage migrate --noinput

      # Seeding goes through save(), so this exercises the models, the widget
      # props schemas and the validator registry end to end.
      - name: Seed the example
        run: uv run python -m example.manage seed_example --reset

      - name: Walk a response through the flow
        run: uv run python -m example.manage demo_response

  demo:
    name: React demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            demo/package-lock.json

      # The demo builds the client package before itself, so the client's own
      # dependencies have to be here too.
      - name: Install the client
        run: npm ci
        working-directory: client

      - name: Install the demo
        run: npm ci
        working-directory: demo

      # Building it builds the client package first, so this checks the two
      # against each other: the demo only compiles if the plan types still
      # describe what it renders.
      - run: npm run build
        working-directory: demo

      - run: npm run typecheck
        working-directory: demo

  client:
    name: TypeScript client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install the client
        run: npm ci
        working-directory: client

      - run: npm run typecheck
        working-directory: client

      # Replays shared/conformance-cases.json, which the Python suite replays
      # too: this is what catches the two implementations drifting apart.
      - name: Replay the conformance corpus
        run: npm test
        working-directory: client

      - run: npm run build
        working-directory: client

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --all-groups

      - name: Run every hook
        run: uv run pre-commit run --all-files --show-diff-on-failure
